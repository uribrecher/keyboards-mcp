name: Release

# Publishes keyboards-mcp to npm via OIDC Trusted Publishing when a version tag
# (vX.Y.Z) is pushed. Also runnable on demand from the Actions tab.
#
# NO stored secret. npm write tokens now expire after 90 days, so an NPM_TOKEN
# secret would silently break releases every quarter. Instead this uses GitHub
# OIDC: npm mints a short-lived credential per run — nothing to rotate or expire,
# and build provenance is attested automatically.
#
# One-time setup (trusted publishing is per-package, so it only appears once the
# package exists on npm):
#   1. Bootstrap the package once:  npm login && npm publish -w keyboards-mcp --access public
#   2. npmjs.com -> Packages -> keyboards-mcp -> Settings -> Trusted publishing ->
#      add a GitHub Actions publisher:
#        Organization or user: uribrecher
#        Repository:           keyboards-mcp
#        Workflow filename:    release.yml
#        Allowed actions:      npm publish   (required for publishers created after 2026-05-20)
#   Requires npm >= 11.5.1 and Node >= 22.14.0 (handled below). After that, every
#   tagged release publishes with no token; provenance is automatic.
#
# To cut a release: bump "version" in packages/keyboards-mcp/package.json, commit to main, then
#   git tag "v$(node -p "require('./packages/keyboards-mcp/package.json').version")" && git push origin --tags

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs publish package.json's CURRENT version as-is (the tag-match check
  # below is skipped). npm rejects republishing an existing version, so fail-safe.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC: trusted-publishing auth + provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an in-flight publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Dockerfile / CI Node major.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.x, so upgrade.
      - name: Upgrade npm (OIDC trusted-publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies (for the publish build)
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./packages/keyboards-mcp/package.json').version")"
          # GITHUB_REF_NAME is the tag name; read it as an env var (not interpolated
          # via GitHub Actions expression syntax) to avoid any script-injection from the ref.
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'. Bump package.json or fix the tag."
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      # Gate on the SAME suite CI runs on every PR — full unit + integration + e2e
      # in Docker with MIDI_TRANSPORT=ws. Don't publish on anything weaker than CI.
      # The 90% coverage gate is intentionally NOT run here so a pre-existing
      # coverage gap can't block a release.
      - name: Run tests (same Docker suite as CI)
        run: docker compose -f docker-compose.test.yml run --rm test

      - name: Cleanup test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down

      # OIDC trusted publishing: no NODE_AUTH_TOKEN. `npm publish` runs the
      # prepublishOnly script (npm run build) first, so the tarball always ships a
      # fresh dist/. Provenance is generated automatically under trusted publishing.
      # (--access public is a harmless no-op for the unscoped, public keyboards-mcp.)
      - name: Publish to npm
        run: npm publish -w keyboards-mcp --provenance --access public
