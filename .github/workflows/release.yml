name: Release

# Two-package release automation via Changesets.
#
# This repo ships TWO artifacts from one workspaces monorepo: the published
# `keyboards-mcp` npm package and the PRIVATE `sounds-and-recreation-app` desktop
# app. They version independently, so release must never let an app-only bump
# publish the MCP server. The single-package "publish on any v* tag" flow this
# replaced could not make that distinction; the Changesets flow below does.
#
# How a release happens now (no manual version tags):
#   1. Feature PRs land on main carrying a changeset (.changeset/*.md) that records
#      which package(s) bumped and how. The CI `changeset` gate enforces this.
#   2. This workflow runs on every push to main. While unconsumed changesets exist,
#      changesets/action opens/updates a "Version Packages" PR that applies the
#      bumps + writes each package's CHANGELOG. NOTHING is published at this stage.
#   3. Merging that PR consumes the changesets. This workflow runs again, finds no
#      changesets left, and runs `changeset publish` — which publishes ONLY the
#      public `keyboards-mcp` package and SKIPS the private app (Changesets never
#      publishes private packages). So an app-only release versions the app and
#      writes its changelog but never hits npm.
#
# Why no test step here: the commit being published has already passed the full CI
# suite (lint + audit + Docker test + coverage) TWICE — once on the feature PR, and
# again on the CI-gated "Version Packages" PR. Publishing is triggered only by
# merging that CI-passing PR, so re-running tests at publish time is redundant.
#
# Publishing uses npm OIDC Trusted Publishing — NO stored NPM_TOKEN (npm write
# tokens expire after 90 days; OIDC mints a short-lived per-run credential and
# attests build provenance automatically). Trusted publishing is configured
# per-package on npmjs.com against THIS workflow filename (release.yml) — keep the
# filename as-is or the trusted publisher must be reconfigured.
#
# One-time setup (trusted publishing is per-package, so it only appears once the
# package exists on npm):
#   1. Bootstrap the package once:  npm login && npm publish -w keyboards-mcp --access public
#   2. npmjs.com -> Packages -> keyboards-mcp -> Settings -> Trusted publishing ->
#      add a GitHub Actions publisher:
#        Organization or user: uribrecher
#        Repository:           keyboards-mcp
#        Workflow filename:    release.yml
#        Allowed actions:      npm publish   (required for publishers created after 2026-05-20)
#   Requires npm >= 11.5.1 and Node >= 22.14.0 (handled below). After that, every
#   release publishes with no token; provenance is automatic.

on:
  push:
    branches: [main]
  # Manual runs behave the same: open/update the Version PR if changesets exist,
  # otherwise publish the current versions. npm rejects republishing an existing
  # version, so a no-op manual run is fail-safe.
  workflow_dispatch:

permissions:
  contents: write       # changesets/action commits the version bumps + pushes the Version PR branch
  pull-requests: write  # ...and opens/updates that PR
  id-token: write       # OIDC: trusted-publishing auth + provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an in-flight publish

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Changesets needs full history to compute bumps + changelogs

      - uses: actions/setup-node@v4
        with:
          # Match the Dockerfile / CI Node major.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.x, so upgrade.
      # Pin to the 11.x major (floored at the OIDC minimum) rather than @latest so a
      # future npm major can't silently change publish behavior in the middle of a release.
      - name: Upgrade npm (OIDC trusted-publishing support)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci

      # changesets/action does double duty per run:
      #   - changesets present -> open/update the "Version Packages" PR (no publish)
      #   - no changesets left -> run `changeset publish` (publishes keyboards-mcp,
      #                           skips the private sounds-and-recreation-app)
      # `changeset publish` invokes `npm publish` per public package, which runs the
      # package's prepublishOnly (npm run build) for a fresh dist/, and uses OIDC
      # trusted publishing automatically given id-token:write + npm >= 11.5.1.
      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true   # attach build provenance on publish
