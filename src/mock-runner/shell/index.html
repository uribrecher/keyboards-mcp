<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOCK RUNNER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,500;9..144,700;9..144,900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ┌─ Top chassis: brand strip + tab rail ─────────────────────────────┐ -->
  <header class="chassis">
    <div class="chassis__rule chassis__rule--top"></div>

    <div class="brand">
      <span class="brand__lamp" aria-hidden="true"></span>
      <span class="brand__name">MOCK&nbsp;RUNNER</span>
      <span class="brand__sep">·</span>
      <span class="brand__sub">MULTI-DEVICE TEST RACK</span>
      <span class="brand__screws" aria-hidden="true">
        <span class="screw"></span><span class="screw"></span>
      </span>
    </div>

    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Open mocks">
      <!-- tabs injected here -->
      <button class="tabbar__plus" id="tab-new" aria-label="New tab">+</button>
    </nav>

    <div class="chassis__rule chassis__rule--bottom"></div>
  </header>

  <!-- ┌─ Main split: iframe stack + chat console ─────────────────────────┐ -->
  <main class="bay">
    <section class="slot" id="slot">
      <!-- iframes get injected here, one per tab -->
      <div class="slot__empty" id="slot-empty">
        <div class="slot__empty-rail"></div>
        <div class="slot__empty-msg">— EMPTY RACK SLOT —</div>
        <div class="slot__empty-rail"></div>
      </div>
    </section>

    <aside class="console" id="console">
      <!-- Tabbed box: tabs are first-class. CHAT tab carries the agent
           identity strip (lamp + SID + meter); LOG tab carries an unread
           severity-tinted LED. The action buttons that used to live up
           here (backup / reset / clear) have been removed pending
           backlog #19. -->
      <div class="console__tabs" role="tablist" aria-label="Console panes">
        <button class="console__tab" id="tab-chat" role="tab"
                aria-selected="true" aria-controls="chat-log"
                data-state="unknown">
          <span class="console__lamp"></span>
          <span class="console__sid" id="agent-sid"
                title="Agent process id — changes if the agent restarts">
            <span class="console__sid-label">SID:</span><span
                  class="console__sid-value" id="agent-sid-value">—</span>
          </span>
          <span class="console__meter" id="agent-status" data-state="unknown">
            <span></span><span></span><span></span><span></span><span></span>
          </span>
        </button>
        <button class="console__tab" id="tab-log" role="tab"
                aria-selected="false" aria-controls="event-log">
          <span class="console__tab-label">LOG</span>
          <span class="console__unread" id="event-log-unread" hidden></span>
        </button>
      </div>

      <div class="console__log" id="chat-log" role="log" aria-live="polite">
        <div class="chat-row chat-row--system">
          <p class="chat-line">Bring up a model on the rack. Then ask Claude to drive it.</p>
        </div>
      </div>

      <div class="console__log console__log--events" id="event-log"
           role="log" aria-live="polite" hidden>
        <div class="event-log__empty">— no events —</div>
      </div>

      <form class="composer" id="chat-form" autocomplete="off">
        <div class="composer__prompt">›</div>
        <textarea
          class="composer__input"
          id="chat-input"
          rows="1"
        ></textarea>
      </form>
    </aside>
  </main>

  <!-- ┌─ Backup picker modal ─────────────────────────────────────────────┐ -->
  <div class="modal" id="backup-modal" hidden>
    <div class="modal__sheet" role="dialog" aria-modal="true" aria-labelledby="backup-modal-title">
      <header class="modal__header">
        <h2 id="backup-modal-title">EXTRACT BACKUP</h2>
        <button class="modal__close" id="backup-cancel" aria-label="Cancel">✕</button>
      </header>
      <p class="modal__hint">Pick the device this backup belongs to. Its inventory will be stored under that label.</p>
      <ul class="modal__devices" id="backup-device-list"></ul>
      <footer class="modal__footer">
        <button class="ghost" id="backup-cancel-2">Cancel</button>
        <button class="primary" id="backup-confirm">Choose file…</button>
      </footer>
    </div>
  </div>

  <!--
    Bare-specifier import map for @sounds-and-recreation/agent-client.
    The path is relative to this index.html (src/mock-runner/shell/) and
    points at the file: dep symlinked under the repo's node_modules.
    See plan #12 — caveats: file: dep + import map don't survive a
    packaged Electron .app, the macOS packager will need to copy
    client-sdk/dist/ next to the renderer and rewrite this URL.
  -->
  <script type="importmap">
  {
    "imports": {
      "@sounds-and-recreation/agent-client": "../../../node_modules/@sounds-and-recreation/agent-client/dist/index.js",
      "marked": "../../../node_modules/marked/lib/marked.esm.js"
    }
  }
  </script>
  <script src="app.js" type="module"></script>
</body>
</html>
