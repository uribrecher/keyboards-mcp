<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roland JUNO-X — Mock Device</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">
    <div class="panel">

      <!-- Header -->
      <header class="header">
        <div class="header-brand">
          <span class="brand-roland">Roland</span>
          <span class="brand-model">JUNO-X</span>
        </div>
        <div class="scene-display" id="display-scene">
          <span class="scene-number" id="val-scene-number">01</span>
          <span class="scene-name" id="val-scene-name">Init Patch</span>
        </div>
        <div class="header-right">
          <span class="subtitle">MOCK MIDI DEVICE</span>
        </div>
      </header>

      <!-- Part / Engine Nav Bar -->
      <nav class="part-bar">
        <div class="engine-selector-group">
          <label class="engine-selector-label">ENGINE</label>
          <select id="engine-select" class="engine-select">
            <option value="analog-synth">Analog Synth (106/60)</option>
            <option value="zcore">ZCore Synth</option>
            <option value="juno-x-model">JUNO-X Model</option>
            <option value="rd-piano">RD Piano</option>
          </select>
        </div>
        <div class="part-buttons">
          <span class="part-label">PART</span>
          <button class="part-btn active" data-part="1">1</button>
          <button class="part-btn" data-part="2">2</button>
          <button class="part-btn" data-part="3">3</button>
          <button class="part-btn" data-part="4">4</button>
          <button class="part-btn" data-part="5">5</button>
        </div>
      </nav>

      <!-- ===== ANALOG SYNTH PANEL ===== -->
      <main id="panel-analog-synth" class="synth-panel">

        <!-- Single horizontal row of all sections -->
        <div class="hw-row">

          <!-- LFO -->
          <section class="hw-section">
            <div class="section-label synth-label">LFO</div>
            <div class="sliders-row">
              <div class="slider-col">
                <div class="ctrl-value" id="val-lfo_rate">64</div>
                <input type="range" class="vslider" min="0" max="127" value="64" data-param="lfo_rate" id="param-lfo_rate">
                <label for="param-lfo_rate" class="ctrl-label">RATE</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-lfo_delay_time">0</div>
                <input type="range" class="vslider" min="0" max="127" value="0" data-param="lfo_delay_time" id="param-lfo_delay_time">
                <label for="param-lfo_delay_time" class="ctrl-label">DLY</label>
              </div>
            </div>
            <div class="toggle-row">
              <select class="ctrl-select-sm" data-param="lfo_waveform" id="param-lfo_waveform">
                <option value="0">TRI</option>
                <option value="1">SAW</option>
                <option value="2">SQR</option>
                <option value="3">RND</option>
              </select>
              <button class="tog-btn" data-param="lfo_sync" id="param-lfo_sync">SYNC</button>
            </div>
          </section>

          <div class="section-divider"></div>

          <!-- OSC -->
          <section class="hw-section osc-section">
            <div class="section-label synth-label">OSC</div>
            <div class="sliders-row">
              <div class="slider-col">
                <div class="ctrl-value" id="val-pw_level">0</div>
                <input type="range" class="vslider" min="0" max="127" value="0" data-param="pw_level" id="param-pw_level">
                <label for="param-pw_level" class="ctrl-label">PW</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-saw_level">127</div>
                <input type="range" class="vslider" min="0" max="127" value="127" data-param="saw_level" id="param-saw_level">
                <label for="param-saw_level" class="ctrl-label">SAW</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-sub_level">0</div>
                <input type="range" class="vslider" min="0" max="127" value="0" data-param="sub_level" id="param-sub_level">
                <label for="param-sub_level" class="ctrl-label">SUB</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-noise_level">0</div>
                <input type="range" class="vslider" min="0" max="127" value="0" data-param="noise_level" id="param-noise_level">
                <label for="param-noise_level" class="ctrl-label">NOIS</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-osc_lfo_mod">64</div>
                <input type="range" class="vslider" min="0" max="127" value="64" data-param="osc_lfo_mod" id="param-osc_lfo_mod">
                <label for="param-osc_lfo_mod" class="ctrl-label">LFO</label>
              </div>
            </div>
            <div class="toggle-row">
              <button class="tog-btn" data-param="super_saw" id="param-super_saw">SSAW</button>
            </div>
          </section>

          <div class="section-divider"></div>

          <!-- HPF -->
          <section class="hw-section hpf-section">
            <div class="section-label synth-label">HPF</div>
            <div class="sliders-row">
              <div class="slider-col">
                <div class="ctrl-value" id="val-hpf_step">0</div>
                <!-- HPF only has 4 steps (0-3), use a select styled as slider column -->
                <select class="ctrl-select-vert" data-param="hpf_step" id="param-hpf_step">
                  <option value="0">0</option>
                  <option value="42">1</option>
                  <option value="85">2</option>
                  <option value="127">3</option>
                </select>
                <label for="param-hpf_step" class="ctrl-label">FREQ</label>
              </div>
            </div>
            <div class="toggle-row"></div>
          </section>

          <div class="section-divider"></div>

          <!-- FILTER -->
          <section class="hw-section filter-section">
            <div class="section-label synth-label">FILTER</div>
            <div class="sliders-row">
              <div class="slider-col">
                <div class="ctrl-value" id="val-cutoff">127</div>
                <input type="range" class="vslider" min="0" max="127" value="127" data-param="cutoff" id="param-cutoff">
                <label for="param-cutoff" class="ctrl-label">CUT</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-resonance">0</div>
                <input type="range" class="vslider" min="0" max="127" value="0" data-param="resonance" id="param-resonance">
                <label for="param-resonance" class="ctrl-label">RES</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-flt_env_depth">64</div>
                <input type="range" class="vslider" min="0" max="127" value="64" data-param="flt_env_depth" id="param-flt_env_depth">
                <label for="param-flt_env_depth" class="ctrl-label">ENV</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-flt_key_follow">0</div>
                <input type="range" class="vslider" min="0" max="127" value="0" data-param="flt_key_follow" id="param-flt_key_follow">
                <label for="param-flt_key_follow" class="ctrl-label">KEY</label>
              </div>
            </div>
            <div class="toggle-row">
              <select class="ctrl-select-sm" data-param="vintage_flt_type" id="param-vintage_flt_type">
                <option value="0">VFlt OFF</option>
                <option value="64">VFlt A</option>
                <option value="127">VFlt B</option>
              </select>
            </div>
          </section>

          <div class="section-divider"></div>

          <!-- AMP -->
          <section class="hw-section amp-section">
            <div class="section-label synth-label">AMP</div>
            <div class="sliders-row">
              <div class="slider-col">
                <div class="ctrl-value" id="val-amp_level">100</div>
                <input type="range" class="vslider" min="0" max="127" value="100" data-param="amp_level" id="param-amp_level">
                <label for="param-amp_level" class="ctrl-label">LVL</label>
              </div>
            </div>
            <div class="toggle-row"></div>
          </section>

          <div class="section-divider"></div>

          <!-- ENV -->
          <section class="hw-section env-section">
            <div class="section-label synth-label">ENV</div>
            <div class="sliders-row">
              <div class="slider-col">
                <div class="ctrl-value" id="val-env_attack">0</div>
                <input type="range" class="vslider" min="0" max="127" value="0" data-param="env_attack" id="param-env_attack">
                <label for="param-env_attack" class="ctrl-label">A</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-env_decay">64</div>
                <input type="range" class="vslider" min="0" max="127" value="64" data-param="env_decay" id="param-env_decay">
                <label for="param-env_decay" class="ctrl-label">D</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-env_sustain">100</div>
                <input type="range" class="vslider" min="0" max="127" value="100" data-param="env_sustain" id="param-env_sustain">
                <label for="param-env_sustain" class="ctrl-label">S</label>
              </div>
              <div class="slider-col">
                <div class="ctrl-value" id="val-env_release">30</div>
                <input type="range" class="vslider" min="0" max="127" value="30" data-param="env_release" id="param-env_release">
                <label for="param-env_release" class="ctrl-label">R</label>
              </div>
            </div>
            <div class="toggle-row adsr-label">ADSR</div>
          </section>

          <div class="section-divider"></div>

          <!-- EFFECTS -->
          <section class="hw-section effects-section">
            <div class="section-label effects-label">EFFECTS</div>
            <div class="sliders-row effects-inner">
              <div class="effects-col">
                <div class="effects-col-label">CHO</div>
                <div class="chorus-btns">
                  <button class="tog-btn fx-chorus" data-mode="I">I</button>
                  <button class="tog-btn fx-chorus" data-mode="II">II</button>
                  <button class="tog-btn fx-chorus" data-mode="I+II">I+II</button>
                  <button class="tog-btn fx-chorus active off-btn" data-mode="OFF">OFF</button>
                </div>
              </div>
              <div class="effects-col">
                <div class="effects-col-label">FX</div>
                <div class="fx-toggles">
                  <button class="tog-btn" data-fx="delay" id="fx-delay">DLY</button>
                  <button class="tog-btn" data-fx="reverb" id="fx-reverb">REV</button>
                  <button class="tog-btn" data-fx="drive" id="fx-drive">DRV</button>
                </div>
              </div>
            </div>
            <div class="toggle-row"></div>
          </section>

        </div><!-- end hw-row -->

      </main><!-- end #panel-analog-synth -->

      <!-- ===== ZCORE PANEL (placeholder) ===== -->
      <main id="panel-zcore" class="synth-panel hidden">
        <div class="placeholder-panel">
          <div class="placeholder-icon">Z</div>
          <div class="placeholder-title">ZCore Synth</div>
          <div class="placeholder-text">Panel not yet implemented</div>
        </div>
      </main>

      <!-- ===== JUNO-X MODEL PANEL (placeholder) ===== -->
      <main id="panel-juno-x-model" class="synth-panel hidden">
        <div class="placeholder-panel">
          <div class="placeholder-icon">JX</div>
          <div class="placeholder-title">JUNO-X Model</div>
          <div class="placeholder-text">Panel not yet implemented</div>
        </div>
      </main>

      <!-- ===== RD PIANO PANEL (placeholder) ===== -->
      <main id="panel-rd-piano" class="synth-panel hidden">
        <div class="placeholder-panel">
          <div class="placeholder-icon">RD</div>
          <div class="placeholder-title">RD Piano</div>
          <div class="placeholder-text">Panel not yet implemented</div>
        </div>
      </main>

    </div><!-- end .panel -->

  </div><!-- end .layout -->

  <script src="app.js"></script>
</body>
</html>
